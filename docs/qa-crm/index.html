// filtros PostgREST mínimos
function filtrar(tabla, qs) {
  const p = new URLSearchParams(qs); let filas = DB[tabla].slice(); let orden = null, lim = null;
  for (const [k, v] of p) {
    if (k === 'select') continue;
    if (k === 'order') { orden = v; continue; }
    if (k === 'limit') { lim = +v; continue; }
    if (k === 'or') { const conds = v.replace(/^\(|\)$/g, '').split(','); filas = filas.filter(f => conds.some(c => { const [col, op, ...r] = c.split('.'); const pat = r.join('.').replace(/\*/g, ''); return op === 'ilike' && String(f[col] || '').toLowerCase().includes(pat.toLowerCase()); })); continue; }
    const [op, ...r] = v.split('.'); const val = r.join('.');
    filas = filas.filter(f => op === 'eq' ? String(f[k]) === val : op === 'lt' ? Date.parse(f[k]) < Date.parse(val) : op === 'neq' ? String(f[k]) !== val : true);
  }
  if (orden) { const [col, dir] = orden.split('.'); filas.sort((a, b) => { const x = a[col] ? Date.parse(a[col]) || a[col] : -Infinity, y = b[col] ? Date.parse(b[col]) || b[col] : -Infinity; return (x < y ? -1 : x > y ? 1 : 0) * (dir === 'desc' ? -1 : 1); }); }
  if (lim) filas = filas.slice(0, lim);
  return JSON.parse(JSON.stringify(filas));
}
const espera = ms => new Promise(r => setTimeout(r, ms));

  async patch(t, filtro, b) { await espera(10); LLAMADAS.push(['patch', t, filtro, b]); const id = filtro.split('eq.')[1]; const f = (DB[t] || []).find(x => String(x.id) === id); if (f) Object.assign(f, b); return f ? [JSON.parse(JSON.stringify(f))] : []; },

  if (f === 'crm_mis_transferencias') return JSON.parse(JSON.stringify(MIS_TR));
  if (f === 'crm_transferencia_vista') { const t = MIS_TR.find(x => x.id === b.p_id); if (t) t.visto_at = ISO(Date.now()); return null; }
  return [{ id: 'u1', nom: 'Admin' }];
}

window.nxPosCtx = { renderPOS() { CUENTA.renderPOS++; document.getElementById('view').innerHTML = window.nxCRM.render(); }, sesion: () => ({ id: QP.get('yo') || 'u1', nom: 'Admin' }), rolEfectivo: () => QP.get('rol') || 'admin', crmPermisos: () => { const q = new URLSearchParams(location.search).get('perm'); return { crm: !q || q === 'crm', bandeja: !q || q === 'bandeja' }; }, clientes: () => [], elegirCliente() {}, nextSeq: async () => 'CRM-1', cotizar() {}, facturar() {} };

const fetchReal = window.fetch;
window.fetch = async (url, opt) => {
  url = String(url); const body = opt && opt.body && typeof opt.body === 'string' ? JSON.parse(opt.body) : null;
  const res = (o, st) => new Response(JSON.stringify(o), { status: st || 200, headers: { 'Content-Type': 'application/json' } });

};
