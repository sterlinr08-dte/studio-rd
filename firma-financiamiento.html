<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0a0a">
<title>Firma de contrato · Studio</title>
<link rel="icon" href="icon-32.png">
<!-- Página pública de firma del contrato de financiamiento (STUDIO, 2026-09-23).
     Solo usa las funciones pos_fin_firma_ver / pos_fin_firma_guardar (security definer) con la llave anon pública;
     el rol anon no puede leer tablas. El token del link es único por contrato y vence. -->
<style>
:root{--ink:#111;--mute:#5b5951;--line:rgba(90,72,20,.18);--line2:rgba(128,101,21,.1);--gold:#c9a227;--gold-d:#806515;--gold-s:rgba(201,162,39,.16);--bg:#f3f0e8;--card:#fffefa;--black:#0a0a0a;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text",system-ui,Inter,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
.top{background:var(--black);color:#fffefa;padding:calc(14px + env(safe-area-inset-top)) 18px 16px;display:flex;align-items:center;gap:12px}
.top img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:#171717}
.top b{display:block;font-size:17px;letter-spacing:.02em}.top span{font-size:12px;color:rgba(255,254,250,.6)}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--mute);font-size:13.5px;line-height:1.45}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kv div{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.kv span{display:block;font-size:11.5px;color:var(--mute);font-weight:600}.kv b{font-size:16px;font-variant-numeric:tabular-nums}
.kv .big{grid-column:1/-1;border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}td.r,th.r{text-align:right}
.contrato{white-space:pre-wrap;font-family:Georgia,"Times New Roman",serif;font-size:14px;line-height:1.55;max-height:46vh;overflow:auto;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:14px;-webkit-overflow-scrolling:touch}
label.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;margin:12px 0;cursor:pointer}
label.chk input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--black)}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.f span{font-size:12.5px;font-weight:600;color:var(--mute)}
.f input{height:48px;border:1.5px solid rgba(0,0,0,.16);border-radius:12px;padding:0 14px;font-size:17px;background:#fff;color:var(--ink);font-family:inherit}
.f input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.28)}
.pad{position:relative;border:1.5px dashed rgba(0,0,0,.25);border-radius:14px;background:#fff;touch-action:none}
.pad canvas{display:block;width:100%;height:200px;border-radius:14px}
.pad .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b7b2a6;font-size:15px;pointer-events:none}
.row{display:flex;gap:10px;margin-top:10px}
button{font-family:inherit;cursor:pointer}
.btn{flex:1;min-height:52px;border-radius:14px;border:1px solid rgba(0,0,0,.14);background:#fff;font-size:16px;font-weight:600;color:var(--ink)}
.btn.p{flex:2;border:0;background:linear-gradient(180deg,#dcb63e 0%,#c9a227 55%,#b8921f 100%);color:var(--black);font-weight:700;font-size:17px;box-shadow:0 1px 2px rgba(128,101,21,.35)}
.btn[disabled]{opacity:.45;cursor:default}
.msg{padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45;margin-top:10px;display:none}
.msg.bad{display:block;background:#fef2f2;border:1px solid #fecaca;color:var(--bad)}
.estado{text-align:center;padding:36px 20px}.estado .ic{font-size:54px;line-height:1;margin-bottom:10px}
.estado.ok .ic{color:var(--ok)}.estado.bad .ic{color:var(--bad)}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:14px;line-height:1.5}
.load{padding:60px 20px;text-align:center;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><img src="logo-studio.png" alt=""><div><b id="emp">STUDIO</b><span>Contrato de financiamiento</span></div></header>
<main id="app"><div class="load">Cargando tu contrato…</div></main>
<script>
(function () {
  'use strict';
  var URL_BASE = 'https://edbknlkjnlfmkkiizdbe.supabase.co/rest/v1/rpc/';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkYmtubGtqbmxmbWtraWl6ZGJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMjg3MTYsImV4cCI6MjEwNTYwNDcxNn0.WKAda5kdWH9TxT0YbMNhJu-DoLFmXgLyrJFGD7Nr2Ec';
  var app = document.getElementById('app');
  var token = new URLSearchParams(location.search).get('t') || '';
  var D = null, pad = null, trazos = 0;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function rd(v) { var n = Math.round((Number(v) || 0) * 100) / 100; return 'RD$ ' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fecha(iso) { if (!iso) return ''; var d = String(iso).slice(0, 10).split('-'); return d[2] + '/' + d[1] + '/' + d[0]; }
  function fechaHora(iso) { try { return new Date(iso).toLocaleString('es-DO', { timeZone: 'America/Santo_Domingo', dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return fecha(iso); } }
  function rpc(fn, body) {
    return fetch(URL_BASE + fn, { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j && j.message) || 'Error de conexión'); return j; }); });
  }
  function estado(cls, ic, titulo, texto) {
    app.innerHTML = '<div class="card estado ' + cls + '"><div class="ic">' + ic + '</div><h1>' + esc(titulo) + '</h1><p class="sub">' + texto + '</p></div><p class="foot">Si tienes dudas, escribe a la tienda por WhatsApp.</p>';
  }
  var FREC = { semanal: 'semanales', quincenal: 'quincenales', mensual: 'mensuales' };
  function pintar() {
    var cuotas = D.cuotas || [];
    var total = cuotas.reduce(function (a, c) { return a + (Number(c.monto) || 0); }, 0);
    app.innerHTML =
      '<div class="card"><h1>Hola, ' + esc((D.cliente || '').split(' ')[0]) + '</h1><p class="sub">Revisa tu contrato <b>' + esc(D.codigo || '') + '</b>. Cuando estés de acuerdo, fírmalo al final con tu dedo.</p>' +
      '<div class="kv"><div><span>Artículo</span><b style="font-size:14px">' + esc(D.descripcion || '—') + '</b></div><div><span>Precio</span><b>' + rd(D.precio) + '</b></div>' +
      '<div><span>Inicial</span><b>' + rd(D.inicial) + '</b></div><div><span>Financiado</span><b>' + rd(D.capital) + '</b></div>' +
      '<div class="big"><span>' + cuotas.length + ' cuotas ' + esc(FREC[D.frecuencia] || D.frecuencia || '') + ' · total a pagar en cuotas</span><b>' + rd(total) + '</b></div></div></div>' +
      '<div class="card"><h2>Tus cuotas</h2><table><thead><tr><th>#</th><th>Fecha</th><th class="r">Monto</th></tr></thead><tbody>' +
      cuotas.map(function (c) { return '<tr><td>' + c.numero + '</td><td>' + fecha(c.fecha) + '</td><td class="r">' + rd(c.monto) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="card"><h2>' + esc(D.titulo || 'Contrato') + '</h2><div class="contrato">' + esc(D.contrato || '') + '</div>' +
      '<label class="chk"><input type="checkbox" id="acepto"><span>Leí el contrato completo y estoy de acuerdo con sus condiciones, las cuotas y la mora.</span></label></div>' +
      '<div class="card"><h2>Firma</h2>' +
      '<div class="f"><span>Tu nombre completo</span><input id="nombre" autocomplete="name" value="' + esc(D.cliente || '') + '"></div>' +
      (D.pide_telefono ? '<div class="f"><span>Últimos 4 dígitos de tu teléfono (para confirmar que eres tú)</span><input id="tel4" inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="off" placeholder="0000"></div>' : '') +
      '<div class="pad"><canvas id="cv" width="1200" height="400" aria-label="Espacio para firmar"></canvas><div class="ph" id="ph">Firma aquí con tu dedo</div></div>' +
      '<div class="row"><button class="btn" type="button" id="limpiar">Borrar</button><button class="btn p" type="button" id="firmar">Firmar contrato</button></div>' +
      '<div class="msg" id="msg"></div></div>' +
      '<p class="foot">Este link es personal y vence: ' + esc(fechaHora(D.vence)) + '<br>Al firmar se guardan la fecha, la hora y tu firma junto al contrato.</p>';
    iniciarPad();
    document.getElementById('limpiar').onclick = function () { pad.ctx.clearRect(0, 0, pad.cv.width, pad.cv.height); trazos = 0; document.getElementById('ph').style.display = ''; };
    document.getElementById('firmar').onclick = firmar;
  }
  function iniciarPad() {
    var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), dib = false;
    ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0a0a0a';
    function pos(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); dib = true; trazos++; document.getElementById('ph').style.display = 'none'; var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
    cv.addEventListener('pointermove', function (e) { if (!dib) return; e.preventDefault(); var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
    function up() { dib = false; } cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    pad = { cv: cv, ctx: ctx };
  }
  var ERR = {
    TELEFONO_NO_COINCIDE: 'Los 4 dígitos no coinciden con el teléfono que tiene la tienda.',
    DEBE_ACEPTAR: 'Marca la casilla de que leíste y aceptas el contrato.',
    FIRMA_INVALIDA: 'La firma está muy corta. Firma de nuevo con tu dedo.',
    YA_FIRMADO: 'Este contrato ya estaba firmado.',
    LINK_VENCIDO: 'Este link venció. Pide a la tienda uno nuevo.',
    LINK_INVALIDO: 'Este link no es válido.',
    FINANCIAMIENTO_NO_ACTIVO: 'Este financiamiento ya no está activo.'
  };
  function error(t) { var m = document.getElementById('msg'); m.className = 'msg bad'; m.textContent = t; m.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  function firmar() {
    var ac = document.getElementById('acepto').checked, nom = document.getElementById('nombre').value.trim(), t4 = D.pide_telefono ? document.getElementById('tel4').value.trim() : '';
    if (!ac) return error(ERR.DEBE_ACEPTAR);
    if (nom.length < 5) return error('Escribe tu nombre completo.');
    if (D.pide_telefono && !/^\d{4}$/.test(t4)) return error('Escribe los últimos 4 dígitos de tu teléfono.');
    if (trazos < 1) return error('Firma en el recuadro con tu dedo.');
    var b = document.getElementById('firmar'); b.disabled = true; b.textContent = 'Guardando…';
    rpc('pos_fin_firma_guardar', { p_token: token, p_firma: pad.cv.toDataURL('image/png'), p_tel4: t4, p_nombre: nom, p_acepta: true })
      .then(function (r) {
        if (r && r.ok) return estado('ok', '✓', '¡Contrato firmado!', 'Tu contrato <b>' + esc(D.codigo || '') + '</b> quedó firmado (' + esc(fechaHora(r.firmado_en)) + ').<br>Gracias por tu compra en ' + esc(D.empresa || 'Studio') + '.');
        b.disabled = false; b.textContent = 'Firmar contrato';
        var e = r && r.error; var t = ERR[e] || 'No se pudo guardar. Intenta de nuevo.';
        if (e === 'TELEFONO_NO_COINCIDE' && r.intentos_restantes != null) t += ' Te quedan ' + r.intentos_restantes + ' intento(s).';
        if (e === 'YA_FIRMADO' || e === 'LINK_VENCIDO' || e === 'LINK_INVALIDO') return estado('bad', '!', 'No se pudo firmar', esc(t));
        error(t);
      })
      .catch(function () { b.disabled = false; b.textContent = 'Firmar contrato'; error('Sin conexión. Revisa tu internet e intenta de nuevo.'); });
  }
  if (!/^[0-9a-f-]{36}$/i.test(token)) { estado('bad', '!', 'Link no válido', 'Abre el link completo que te envió la tienda por WhatsApp.'); return; }
  rpc('pos_fin_firma_ver', { p_token: token }).then(function (r) {
    if (!r || !r.ok) return estado('bad', '!', 'Link no válido', 'Este link no existe. Pide a la tienda que te lo envíe de nuevo.');
    D = r; document.getElementById('emp').textContent = r.empresa || 'STUDIO'; document.title = 'Firma ' + (r.codigo || '') + ' · ' + (r.empresa || 'Studio');
    if (r.firmado) return estado('ok', '✓', 'Contrato ya firmado', 'Tu contrato <b>' + esc(r.codigo || '') + '</b> ya se firmó (' + esc(fechaHora(r.firmado_en)) + ').<br>No tienes que hacer nada más.');
    if (r.vencido) return estado('bad', '!', 'Este link venció', 'Por seguridad los links de firma vencen. Pide a la tienda que te envíe uno nuevo.');
    if (r.estado !== 'activo') return estado('bad', '!', 'Contrato no disponible', 'Este financiamiento ya no está activo.');
    pintar();
  }).catch(function () { estado('bad', '!', 'Sin conexión', 'No pudimos cargar tu contrato. Revisa tu internet y vuelve a abrir el link.'); });
})();
</script>
</body>
</html>
