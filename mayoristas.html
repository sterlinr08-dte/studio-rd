<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add("js")</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>STUDIO Mayoristas</title>
<meta name="theme-color" content="#07080A">
<link rel="icon" href="icon-32.png?v=2" sizes="32x32">
<link rel="apple-touch-icon" href="icon-apple-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* STUDIO · catálogo mayorista privado, con el lenguaje visual de la tienda (studiord.net): noche + oro,
   cada tarjeta del color de su producto con la letra grande de fondo. Un solo tema, pintado explícito.
   Los precios NO están en este archivo: llegan de Supabase (tienda_mayoristas_catalogo) solo si
   el enlace trae la clave (#k=…). Sin clave válida la página no muestra nada. */
:root{
  --noche:#07080A; --panel:#101317;
  --linea:rgba(255,255,255,.08); --linea2:rgba(255,255,255,.14);
  --texto:#F3F2EE; --suave:#A3A6AB; --tenue:#6C7078;
  --oro:#C9A227; --oro-luz:#F2D26A;
  --disp:-apple-system,"SF Pro Display",Inter,system-ui,"Helvetica Neue",sans-serif;
  --sans:-apple-system,"SF Pro Text",Inter,system-ui,"Helvetica Neue",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --resorte:cubic-bezier(.34,1.4,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;overflow-x:clip}
body{background:var(--noche);color:var(--texto);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100svh;overflow-x:hidden;overflow-x:clip;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--oro-luz);outline-offset:3px;border-radius:8px}
.wrap{width:min(1200px,100% - 32px);margin-inline:auto}
.eyebrow{font:600 11.5px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--oro)}

header{position:sticky;top:0;z-index:40;background:rgba(7,8,10,.72);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top)}
.cab{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:block;width:112px;height:26px;overflow:hidden;flex:none}
.logo img{width:124px;margin:-41px 0 0 -7px}
.sello{margin-left:auto;font:700 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--oro-luz);padding:8px 12px;border-radius:999px;border:1px solid rgba(242,210,106,.35);background:rgba(242,210,106,.06)}

/* Portada + pestañas en píldora, igual que el catálogo de la tienda */
.cat-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:18px 28px;flex-wrap:wrap;padding:34px 0 8px}
.cat-cab h1{font:800 clamp(34px,5vw,58px)/1.02 var(--disp);letter-spacing:-.035em;margin-top:10px;text-wrap:balance}
.cat-cab p.lead{color:var(--suave);max-width:48ch;margin-top:10px;font-size:16.5px}
.cat-tabs{display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--linea);overflow-x:auto;scrollbar-width:none;max-width:100%}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tabs button{flex:none;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:999px;font:600 14px var(--sans);color:var(--suave);transition:background .25s,color .25s}
.cat-tabs button small{font:700 10.5px var(--mono);color:var(--tenue)}
.cat-tabs button:hover{color:var(--texto)}
.cat-tabs button[aria-selected="true"]{background:var(--texto);color:#0A0A0A}
.cat-tabs button[aria-selected="true"] small{color:#555}

.grupo{padding-top:34px;scroll-margin-top:84px}
.grupo-cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.grupo-cab h2{font:800 clamp(24px,3vw,34px)/1 var(--disp);letter-spacing:-.03em}
.grupo-cab span{font:700 12px var(--mono);letter-spacing:.14em;color:var(--tenue)}

/* Tarjeta: el mismo tratamiento que .vt de la tienda, en tamaño catálogo */
.pista{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.mc{--tinta:#fff;--suave-vt:rgba(255,255,255,.8);--linea-vt:rgba(255,255,255,.34);position:relative;isolation:isolate;overflow:hidden;border-radius:30px;color:var(--tinta);padding:20px 22px 18px;
  display:grid;grid-template-rows:auto 1fr auto auto;gap:6px;min-height:430px;
  background:var(--tono);background:radial-gradient(60% 55% at 50% 45%,color-mix(in oklab,var(--tono),#fff 20%) 0%,transparent 72%),linear-gradient(155deg,color-mix(in oklab,var(--tono),#fff 6%),color-mix(in oklab,var(--tono),#000 20%));
  box-shadow:0 30px 60px -34px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.18)}
.mc.clara{--tinta:#15171b;--suave-vt:rgba(20,22,26,.72);--linea-vt:rgba(20,22,26,.26)}
.mc-letra{position:absolute;z-index:-1;left:50%;top:44%;translate:-50% -50%;font:900 clamp(150px,20vw,210px)/.8 var(--disp);letter-spacing:-.06em;white-space:nowrap;color:color-mix(in oklab,var(--tono),#fff 13%);pointer-events:none;user-select:none}
.mc.clara .mc-letra{color:color-mix(in oklab,var(--tono),#000 7%)}
.mc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mc-det{font:600 10.5px/1.35 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--suave-vt)}
.estado{flex:none;display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border-radius:999px;border:1px solid var(--linea-vt);color:var(--tinta)}
.estado::before{content:"";width:6px;height:6px;border-radius:50%;background:#5BE38F;box-shadow:0 0 0 3px rgba(91,227,143,.18)}
.estado.no::before{background:#FF7A6B;box-shadow:0 0 0 3px rgba(255,122,107,.18)}
.mc-escena{position:relative;min-height:200px}
.mc-luz{position:absolute;inset:12% 12% 4%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in oklab,var(--tono),#fff 30%),transparent);filter:blur(20px);opacity:.7}
.mc-escena img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 60%;filter:drop-shadow(0 30px 24px rgba(0,0,0,.38));filter:drop-shadow(0 30px 24px color-mix(in oklab,var(--tono),#000 62%))}
.mc.agotado .mc-escena img{filter:grayscale(.8) brightness(.8) drop-shadow(0 26px 24px rgba(0,0,0,.4))}
.mc h3,.mc-pie,.mc-top{position:relative;z-index:1}
.mc h3{font:800 clamp(26px,2.6vw,32px)/.98 var(--disp);letter-spacing:-.035em;text-wrap:balance}
.mc-pie{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;margin-top:8px;border-top:1px solid var(--linea-vt)}
.precio{display:flex;flex-direction:column;gap:3px}
.precio small{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--suave-vt)}
.precio b{font:800 26px/1 var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.agregar{height:44px;padding:0 20px;border-radius:999px;background:var(--tinta);color:color-mix(in oklab,var(--tono),#000 45%);font:700 14.5px var(--sans);box-shadow:0 10px 26px -12px rgba(0,0,0,.6);transition:transform .2s var(--ease)}
.mc.clara .agregar{color:#fff}
.agregar:active{transform:scale(.96)}
.cant{display:flex;align-items:center;height:44px;border-radius:999px;background:var(--tinta);color:color-mix(in oklab,var(--tono),#000 45%);box-shadow:0 10px 26px -12px rgba(0,0,0,.6)}
.mc.clara .cant{color:#fff}
.cant button{width:42px;height:44px;font-size:20px;font-weight:700;color:inherit}
.cant output{min-width:22px;text-align:center;font:800 16px var(--disp);font-variant-numeric:tabular-nums}
.sin-stock{font:600 12.5px var(--sans);color:var(--suave-vt)}

.carro{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(7,8,10,.86);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--linea2);transform:translateY(110%);transition:transform .45s var(--resorte)}
.carro.ver{transform:none}
.carro .wrap{display:flex;align-items:center;gap:14px}
.carro .res{line-height:1.15}
.carro .res small{display:block;font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.carro .res b{font:800 22px var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wa{margin-left:auto;display:inline-flex;align-items:center;gap:9px;height:50px;padding:0 22px;border-radius:999px;background:linear-gradient(180deg,var(--oro-luz),var(--oro));color:#0A0A0A;font:600 15px var(--sans);text-decoration:none;white-space:nowrap;box-shadow:0 0 0 1px rgba(242,210,106,.4),0 8px 30px -8px rgba(201,162,39,.7)}
.wa svg{width:20px;height:20px}

.aviso{padding:90px 0;text-align:center;color:var(--suave)}
.aviso h1{font:800 30px/1.1 var(--disp);letter-spacing:-.03em;color:var(--texto);margin-bottom:10px}
.nota{color:var(--tenue);font-size:13px;padding:36px 0 10px}

/* Celular: cada categoría es una vitrina horizontal como en la tienda (desliza de lado) */
@media (max-width:700px){
  .cat-cab{padding-top:24px}
  .cat-tabs{width:100%}
  .cat-tabs button{padding:0 14px;font-size:13.5px}
  .grupo{padding-top:26px}
  .pista{display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:82vw;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;margin-inline:-16px;padding:4px 16px 10px;scroll-padding-inline:16px}
  .pista::-webkit-scrollbar{display:none}
  .mc{scroll-snap-align:start;min-height:390px;border-radius:26px;padding:18px 18px 16px}
  .mc-escena{min-height:180px}
  .mc h3{font-size:27px}
  .precio b{font-size:24px}

  /* Vitrina en celular: la tarjeta del frente se enfoca y la franja toma su color, como en la tienda. */
  .grupo{--g-tono:#07080A;margin-inline:-16px;padding-inline:16px;padding-bottom:12px;background:color-mix(in oklab,var(--g-tono) 26%,#07080A)}
  .js .mc.si:not(.actual){opacity:.55;transform:scale(.94)}
  .js .mc.si:not(.actual) .mc-escena img{translate:18% 0;scale:.86}
}
/* ── Movimiento (el mismo de la tienda) ── */
.progreso{position:absolute;left:0;bottom:-1px;height:2px;width:100%;transform-origin:left;transform:scaleX(var(--leido,0));background:linear-gradient(90deg,#8A6D12,var(--oro-luz));box-shadow:0 0 10px rgba(242,210,106,.6)}
.cat-cab>div>*,.cat-tabs{animation:portadaEntra .7s var(--ease) both}
.cat-cab h1{animation-delay:.06s}.cat-cab .lead{animation-delay:.12s}.cat-tabs{animation-delay:.2s}
@keyframes portadaEntra{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
/* Tarjetas: aparecen en cascada al verse; la foto llega deslizándose y se enfoca. */
.js .mc{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease),box-shadow .35s var(--ease),--tono .6s var(--ease),color .4s var(--ease)}
.js .mc.si{opacity:1;transform:none}
.mc-escena img{transition:translate .8s var(--ease),scale .8s var(--resorte),opacity .5s var(--ease)}
.js .mc:not(.si) .mc-escena img{translate:18% 0;scale:.86;opacity:0}
@media (hover:hover){
  .js .mc.si:hover{transform:translateY(-4px);box-shadow:0 40px 70px -34px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.22)}
  .mc:hover .mc-escena img{scale:1.04}
}
/* Botón y contador: respuesta al tocar y salto del número. */
.agregar,.cant{animation:pop .35s var(--resorte)}
.cant output.salta,.carro .res b.salta{animation:salta .35s var(--resorte)}
@keyframes pop{from{transform:scale(.86)}to{transform:none}}
@keyframes salta{40%{transform:scale(1.22)}}
.grupo{transition:background-color .7s var(--ease),--g-tono .7s var(--ease)}
/* ── Carrito: se abre desde la barra de abajo o la bolsa de la cabecera ── */
.bolsa{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--linea2);background:rgba(255,255,255,.04);color:var(--texto);animation:pop .4s var(--resorte)}
.bolsa[hidden]{display:none}
.bolsa svg{width:21px;height:21px}
.insignia{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--oro-luz);color:#0A0A0A;font:800 11px/20px var(--sans);text-align:center;font-variant-numeric:tabular-nums}
.insignia.salta{animation:salta .35s var(--resorte)}
.carro button.res{text-align:left;color:var(--texto);padding:4px 6px 4px 0}
.carro .res u{color:var(--oro-luz);text-decoration:none;border-bottom:1px solid rgba(242,210,106,.5)}
.hoja-fondo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .3s var(--ease),visibility .3s}
.hoja{position:fixed;z-index:51;left:0;right:0;bottom:0;max-height:86svh;display:flex;flex-direction:column;background:#0E1014;border:1px solid var(--linea2);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -30px 80px -20px rgba(0,0,0,.8);transform:translateY(105%);visibility:hidden;transition:transform .5s var(--resorte),visibility .5s}
.abierta .hoja-fondo{opacity:1;visibility:visible}
.abierta .hoja{transform:none;visibility:visible}
.abierta body,body.abierta{overflow:hidden}
.hoja-asa{width:40px;height:5px;border-radius:99px;background:rgba(255,255,255,.2);margin:10px auto 0}
.hoja-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 20px 12px;border-bottom:1px solid var(--linea)}
.hoja-cab h2{font:800 26px/1.05 var(--disp);letter-spacing:-.03em;margin-top:4px}
.cerrar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--linea2);color:var(--texto)}
.cerrar svg{width:18px;height:18px}
.hoja-lista{overflow-y:auto;overscroll-behavior:contain;padding:8px 20px;flex:1}
.linea{display:grid;grid-template-columns:64px 1fr auto;grid-template-rows:auto auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--linea)}
.linea:last-child{border-bottom:0}
.linea .mini{grid-row:1/3;width:64px;height:64px;border-radius:16px;background:radial-gradient(60% 60% at 50% 45%,color-mix(in oklab,var(--tono),#fff 18%),var(--tono));display:grid;place-items:center;overflow:hidden}
.linea .mini img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.linea h3{font:700 15.5px/1.2 var(--disp);letter-spacing:-.01em}
.linea .unit{font:500 12.5px var(--mono);color:var(--suave);font-variant-numeric:tabular-nums}
.linea .sub{grid-column:3;grid-row:1;justify-self:end;font:800 16px var(--disp);font-variant-numeric:tabular-nums}
.linea .ctrl{grid-column:2/4;grid-row:2;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.linea .cant{height:36px;background:rgba(255,255,255,.08);color:var(--texto);box-shadow:none;animation:none}
.linea .cant button{width:36px;height:36px;font-size:18px}
.quitar{font:600 12.5px var(--sans);color:#FF8A7D;padding:6px 2px}
.vacio{padding:34px 0;text-align:center;color:var(--suave)}
.hoja-pie{padding:14px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--linea2);display:grid;gap:10px;background:#0B0D10}
.hoja-tot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hoja-tot small{display:block;font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.hoja-tot b{font:800 28px/1.1 var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.vaciar{font:600 13px var(--sans);color:var(--suave);text-decoration:underline;text-underline-offset:3px}
.hoja .wa{margin:0;justify-content:center;width:100%}
.seguir{height:44px;border-radius:999px;border:1px solid var(--linea2);font:600 14.5px var(--sans);color:var(--texto)}
@media (min-width:701px){
  .hoja{left:auto;top:0;width:430px;max-height:none;border-radius:28px 0 0 28px;border-bottom:1px solid var(--linea2);transform:translateX(105%)}
  .hoja-asa{display:none}
}
/* Pestañas fijas bajo la cabecera: siempre a mano para saltar de categoría. */
.tabs-bar{position:sticky;top:calc(64px + env(safe-area-inset-top));z-index:35;margin-inline:-16px;padding:8px 16px;background:rgba(7,8,10,.8);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--linea)}
.grupo{scroll-margin-top:calc(128px + env(safe-area-inset-top))}
.grupo-cab .cuenta{display:none}
@media (min-width:701px){.cat-tabs{width:max-content}}
.ver-btn{display:none}
.mc-det{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:700px){
  /* Portada breve: el primer producto se ve completo sin bajar. */
  .cat-cab{padding:18px 0 14px}
  .cat-cab h1{font-size:31px;margin-top:6px}
  .cat-cab p.lead{font-size:14.5px;line-height:1.45;margin-top:6px}
  .sello{font-size:10px;padding:7px 10px;letter-spacing:.14em}
  .cab{height:60px;gap:10px}
  .tabs-bar{top:calc(60px + env(safe-area-inset-top))}
  .cat-tabs{width:100%}
  .cat-tabs button{height:38px;padding:0 13px;font-size:13.5px}
  .grupo{scroll-margin-top:calc(116px + env(safe-area-inset-top));padding-top:18px}
  .grupo-cab{margin-bottom:10px;align-items:center}
  .grupo-cab h2{font-size:24px}
  .grupo-cab .total-g{display:none}
  .grupo-cab .cuenta{display:inline-flex;align-items:baseline;gap:4px;font:700 12px var(--mono);letter-spacing:.08em;color:var(--suave)}
  .grupo-cab .cuenta b{color:var(--texto);font-size:14px}
  .grupo-cab .cuenta i{font-style:normal;margin-left:6px;color:var(--oro-luz);transition:opacity .4s}
  .grupo.movido .cuenta i{opacity:0}
  /* Tarjeta: cabe entera junto con la cabecera, las pestañas y la barra del pedido; la de al lado se asoma. */
  .pista{grid-auto-columns:84%;padding-right:40px}
  .mc{min-height:0;height:min(430px,calc(100svh - 250px));grid-template-rows:auto minmax(0,1fr) auto auto}
  .mc-escena{min-height:0}
  /* Barra del pedido: resumen a la izquierda y «Ver pedido» a la derecha; se envía desde el pedido. */
  .carro{padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .carro .wa{display:none}
  .carro .ver-txt{display:none}
  .cat-cab .extra{display:none}
  .carro .res b{font-size:20px}
  .ver-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:48px;padding:0 18px 0 22px;border-radius:999px;background:linear-gradient(180deg,var(--oro-luz),var(--oro));color:#0A0A0A;font:700 15px var(--sans);white-space:nowrap;box-shadow:0 0 0 1px rgba(242,210,106,.4),0 8px 30px -8px rgba(201,162,39,.7)}
  .ver-btn svg{width:18px;height:18px}
  .ver-btn:active{transform:scale(.97)}
  /* Pedido en celular: botones cómodos para el pulgar. */
  .hoja-cab{padding:12px 18px 10px}
  .hoja-lista{padding:4px 18px}
  .hoja-pie{padding:12px 18px calc(14px + env(safe-area-inset-bottom))}
  .linea .cant{height:40px}
  .linea .cant button{width:40px;height:40px}
}
@media (max-width:370px){
  .cat-cab h1{font-size:28px}
  .mc h3{font-size:24px}
  .precio b{font-size:21px}
  .agregar{padding:0 16px}
  .sello{display:none}
  .bolsa{margin-left:auto}
  .cat-cab{padding:14px 0 10px}
}
/* Botones de variante, iguales a los de la tienda: círculo con el color o píldora con el tamaño/modelo. */
.mc{grid-template-rows:auto 1fr auto auto auto}
.mc-var{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:4px}
.mc-var button{display:inline-flex;flex-direction:column;align-items:center;gap:5px;font:600 11px var(--sans);color:var(--suave-vt);-webkit-tap-highlight-color:transparent}
.mc-var .circ{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--linea-vt);transition:border-color .2s,background .2s,scale .3s var(--resorte)}
.mc-var .punto{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
.mc-var button[aria-pressed="true"]{color:var(--tinta)}
.mc-var button[aria-pressed="true"] .circ{background:var(--tinta);border-color:var(--tinta);scale:1.06}
.mc-var button.pill{flex-direction:row;height:34px;padding:0 13px;border:1.5px solid var(--linea-vt);border-radius:999px;background:color-mix(in oklab,var(--tono),#000 10%);font:600 12.5px var(--sans);color:var(--tinta);white-space:nowrap;transition:background .2s,color .2s,transform .2s var(--resorte)}
.mc-var button.pill[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--tono)}
.mc-var button.pill.agot{text-decoration:line-through;opacity:.55}
.mc-var button:active{transform:scale(.94)}
.mc-escena img.cambio{animation:cambio .55s var(--resorte)}
@keyframes cambio{0%{opacity:0;transform:translateX(30px) scale(.94) rotateY(-12deg)}100%{opacity:1;transform:none}}
@media (max-width:700px){
  .mc{grid-template-rows:auto minmax(0,1fr) auto auto auto}
  .mc.con-var{height:min(470px,calc(100svh - 230px))}
  .mc-var{gap:6px 8px}
  .mc-var .circ{width:34px;height:34px}.mc-var .punto{width:18px;height:18px}
  .mc-var button{font-size:10.5px;gap:4px}
  .mc-var button.pill{height:32px;padding:0 9px;font-size:12px}
  .mc-var:has(.pill){gap:6px}
}
/* Cambio de variante animado: el tono de la tarjeta y de la franja se funde (propiedades registradas para
   que el degradado pueda interpolar), el botón elegido rebota y precio/descripción entran deslizándose. */
@property --tono{syntax:'<color>';inherits:true;initial-value:#2a2f38}
@property --g-tono{syntax:'<color>';inherits:true;initial-value:#07080A}
.mc{transition:opacity .7s var(--ease),transform .7s var(--ease),box-shadow .35s var(--ease),--tono .6s var(--ease),color .4s var(--ease)}
.grupo{transition:--g-tono .7s var(--ease)}
.mc-var button[aria-pressed="true"] .circ,.mc-var button.pill[aria-pressed="true"]{animation:pop .42s var(--resorte)}
.mc-var button{transition:transform .18s var(--ease),color .3s var(--ease)}
.mc-var button:active{transform:scale(.92)}
.mc.cambia .precio b,.mc.cambia .mc-det,.mc.cambia .estado{animation:sube .45s var(--ease) both}
.mc.cambia .mc-det{animation-delay:.04s}.mc.cambia .estado{animation-delay:.08s}
.mc.cambia .mc-letra{animation:letra .6s var(--ease) both}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes letra{from{opacity:0;scale:.94}to{opacity:1;scale:1}}
/* ── Al agregar: la foto vuela a la bolsa en curva, la bolsa rebota y asoma un resumen del pedido ── */
.vuelo{position:fixed;z-index:48;left:0;top:0;pointer-events:none;object-fit:contain;filter:drop-shadow(0 14px 14px rgba(0,0,0,.45));will-change:transform,opacity}
.bolsa.recibe{animation:recibe .5s var(--resorte)}
@keyframes recibe{30%{transform:scale(1.28) rotate(-8deg)}60%{transform:scale(.94) rotate(4deg)}}
.asoma{position:fixed;z-index:45;right:12px;top:calc(72px + env(safe-area-inset-top));width:min(300px,calc(100vw - 24px));padding:12px;border-radius:22px;background:rgba(18,20,25,.92);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border:1px solid var(--linea2);box-shadow:0 30px 60px -20px rgba(0,0,0,.85);color:var(--texto);text-align:left;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.94);transform-origin:top right;transition:opacity .25s var(--ease),transform .45s var(--resorte),visibility .45s}
.asoma.si{opacity:1;visibility:visible;transform:none}
.asoma-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--suave);padding:0 2px 8px}
.asoma-cab b{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--oro-luz);color:#0A0A0A;font:800 11px/20px var(--sans);letter-spacing:0;text-align:center}
.asoma-fila{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:6px 2px;border-top:1px solid var(--linea)}
.asoma-fila .mini{width:44px;height:44px;border-radius:12px;background:radial-gradient(60% 60% at 50% 45%,color-mix(in oklab,var(--tono),#fff 18%),var(--tono));display:grid;place-items:center;overflow:hidden}
.asoma-fila .mini img{width:86%;height:86%;object-fit:contain}
.asoma-fila h4{font:700 13px/1.2 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asoma-fila small{font:500 11.5px var(--mono);color:var(--suave);font-variant-numeric:tabular-nums}
.asoma-fila>b{font:800 13.5px var(--disp);font-variant-numeric:tabular-nums}
.asoma-fila.nueva{animation:sube .45s var(--ease) both}
.asoma-mas{font:500 12px var(--sans);color:var(--suave);padding:4px 2px 0}
.asoma-pie{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding-top:10px;border-top:1px solid var(--linea2)}
.asoma-pie b{font:800 18px var(--disp);font-variant-numeric:tabular-nums}
.asoma-pie span{display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:999px;background:linear-gradient(180deg,var(--oro-luz),var(--oro));color:#0A0A0A;font:700 13.5px var(--sans)}
@media (max-width:700px){.asoma{top:calc(118px + env(safe-area-inset-top))}}
/* ── Enviar por WhatsApp: el botón se hunde, un brillo lo cruza, el logo sale volando como mensaje enviado
   y el texto confirma. No retrasa el enlace: WhatsApp se abre al instante, la animación corre a la par. ── */
.wa{position:relative;overflow:hidden;isolation:isolate;-webkit-tap-highlight-color:transparent}
.wa::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);transform:translateX(-120%)}
.wa.envia{animation:waHunde .55s var(--resorte)}
.wa.envia::after{animation:waBrillo .7s var(--ease) .1s}
@keyframes waHunde{25%{transform:scale(.93)}60%{transform:scale(1.04)}}
@keyframes waBrillo{to{transform:translateX(120%)}}
.wa .onda{position:absolute;z-index:-1;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;animation:waOnda .6s var(--ease) forwards}
@keyframes waOnda{from{transform:scale(0);opacity:1}to{transform:scale(16);opacity:0}}
.wa .ok{display:inline-flex;align-items:center;gap:9px;animation:sube .4s var(--ease) both}
.wa .ok svg{animation:pop .45s var(--resorte)}
.viaje{position:fixed;z-index:60;left:0;top:0;width:118px;height:92px;pointer-events:none;will-change:transform}
.viaje svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.viaje .rueda{transform-box:fill-box;transform-origin:center}
.viaje .cosa{position:absolute;bottom:36px;width:38px;height:38px;border-radius:11px;background:radial-gradient(60% 60% at 50% 45%,color-mix(in oklab,var(--tono),#fff 18%),var(--tono));display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.35),0 0 0 1.5px rgba(255,255,255,.18)}
.viaje .cosa img{width:88%;height:88%;object-fit:contain}
.viaje .raya{position:absolute;right:100%;transform-origin:right;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(242,210,106,.9));opacity:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.js .mc,.js .mc .mc-escena img{opacity:1!important;transform:none!important;translate:none!important;scale:none!important}}
</style>

<body>

    <a class="wa" id="wa2" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>Enviar pedido por WhatsApp</a>
    <button class="seguir" data-cerrar>Seguir agregando</button>

<script>
(() => {
  const SB = 'https://edbknlkjnlfmkkiizdbe.supabase.co';
  const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkYmtubGtqbmxmbWtraWl6ZGJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMjg3MTYsImV4cCI6MjEwNTYwNDcxNn0.WKAda5kdWH9TxT0YbMNhJu-DoLFmXgLyrJFGD7Nr2Ec';
  const WHATSAPP = '18297448336';               // número mayorista (confirmado por el dueño)
  const ORDEN = ['Movilidad', 'Monta cargas', 'Hogar', 'Tecnología'];
  const $ = s => document.querySelector(s);
  const rd = n => 'RD$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clave = new URLSearchParams(location.hash.slice(1)).get('k') || '';
  const carro = new Map();   // id → cantidad
  let items = [];

  function aviso(titulo, texto) {
    $('#app').innerHTML = '<div class="aviso"><h1>' + esc(titulo) + '</h1><p>' + esc(texto) + '</p></div>';
  }

  async function cargar() {
    if (clave.length < 20) return aviso('Enlace no válido', 'Pide el enlace del catálogo mayorista a STUDIO.');
    try {
      const r = await fetch(SB + '/rest/v1/rpc/tienda_mayoristas_catalogo', {
        method: 'POST',
        headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_clave: clave }),
      });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      if (!Array.isArray(d)) return aviso('Enlace no válido', 'Este enlace ya no está activo. Pide uno nuevo a STUDIO.');
      items = d;
      recuperar();
      pintar();
    } catch (e) {
      aviso('No se pudo cargar', 'Revisa tu conexión y vuelve a intentarlo.');
    }
  }

  // Misma regla que la tienda: tarjeta clara (tinta oscura) si el tono es luminoso.
  function esClaro(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return false;
    const n = parseInt(m[1], 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; });
    return .2126 * c[0] + .7152 * c[1] + .0722 * c[2] > .45;
  }

  function accion(p) {
    if (!p.disponible) return '<span class="sin-stock">Sin existencia</span>';
    const n = carro.get(p.id) || 0;
    return n ? '<div class="cant"><button data-menos="' + p.id + '" aria-label="Quitar uno">−</button><output>' + n + '</output><button data-mas="' + p.id + '" aria-label="Agregar uno">+</button></div>'
             : '<button class="agregar" data-mas="' + p.id + '">Agregar</button>';
  }

  // Tarjetas como en la tienda: los artículos de una misma familia (colores, tamaños, modelos)
  // van en UNA tarjeta con botones; cada variante conserva su precio, foto y disponibilidad.
  let tarjetas = [];                 // [{ clave, grupo, familia, vars: [items] }]
  const sel = new Map();             // clave de tarjeta → id de la variante elegida
  const tarjetaDe = new Map();       // id de artículo → clave de su tarjeta
  function armarTarjetas() {
    tarjetas = []; tarjetaDe.clear(); const porFam = new Map();
    for (const p of items) {
      const clave = p.familia ? 'f:' + p.grupo + ':' + p.familia : 'a:' + p.id;
      let t = porFam.get(clave);
      if (!t) { t = { clave, grupo: p.grupo, familia: p.familia, vars: [] }; porFam.set(clave, t); tarjetas.push(t); }
      t.vars.push(p); tarjetaDe.set(p.id, clave);
    }
    for (const t of tarjetas) if (!sel.has(t.clave)) sel.set(t.clave, (t.vars.find(v => v.disponible) || t.vars[0]).id);
  }
  const elegida = t => t.vars.find(v => v.id === sel.get(t.clave)) || t.vars[0];

  function botones(t, p) {
    if (t.vars.length < 2) return '';
    return '<div class="mc-var" role="group" aria-label="Opciones de ' + esc(t.familia) + '">' + t.vars.map(v =>
      '<button data-var="' + v.id + '" aria-pressed="' + (v.id === p.id) + '"' + (v.punto ? '' : ' class="pill' + (v.disponible ? '' : ' agot') + '"')
      + (v.disponible ? '' : ' title="Agotado"') + '>'
      + (v.punto ? '<span class="circ"><span class="punto" style="background:' + esc(v.punto) + '"></span></span>' + esc(v.variante) : esc(v.variante)) + '</button>').join('') + '</div>';
  }

  function interior(t) {
    const p = elegida(t);
    return '<span class="mc-letra" aria-hidden="true">' + esc(p.letra || '') + '</span>'
      + '<div class="mc-top"><span class="mc-det">' + esc(p.detalle) + '</span>'
      + '<span class="estado' + (p.disponible ? '">Disponible' : ' no">Agotado') + '</span></div>'
      + '<div class="mc-escena"><div class="mc-luz"></div>' + (p.foto ? '<img src="' + esc(p.foto) + '" alt="' + esc(p.nombre) + '" loading="lazy">' : '') + '</div>'
      + '<h3>' + esc(t.familia || p.nombre) + '</h3>'
      + botones(t, p)
      + '<div class="mc-pie"><div class="precio"><small>Precio mayorista</small><b>' + rd(p.precio) + '</b></div><div class="accion">' + accion(p) + '</div></div>';
  }
  function clases(t) { const p = elegida(t), tono = p.tono || '#2a2f38'; return { tono, clara: esClaro(tono), agotado: !p.disponible, id: p.id }; }

  function tarjeta(t) {
    const c = clases(t);
    return '<article class="mc' + (c.clara ? ' clara' : '') + (c.agotado ? ' agotado' : '') + (t.vars.length > 1 ? ' con-var' : '') + '" data-card="' + esc(t.clave) + '" data-id="' + c.id + '" style="--tono:' + esc(c.tono) + '">'
      + interior(t) + '</article>';
  }

  // Cambiar de variante: la tarjeta toma el color, la foto (con giro de entrada), el precio y el estado de la elegida.
  function elegir(id) {
    const clave = tarjetaDe.get(id), t = tarjetas.find(x => x.clave === clave); if (!t) return;
    const el = [...document.querySelectorAll('.mc')].find(x => x.dataset.card === clave); if (!el) return;
    sel.set(clave, id);
    const c = clases(t);
    el.innerHTML = interior(t);
    el.dataset.id = c.id; el.style.setProperty('--tono', c.tono);
    el.classList.toggle('clara', c.clara); el.classList.toggle('agotado', c.agotado);
    const im = el.querySelector('.mc-escena img'); if (im && !quieto) { im.loading = 'eager'; im.classList.add('cambio'); }
    if (!quieto) { el.classList.remove('cambia'); void el.offsetWidth; el.classList.add('cambia'); }
    if (el.classList.contains('actual')) el.closest('.grupo').style.setProperty('--g-tono', c.tono);
  }

  function pintar() {
    armarTarjetas();
    const grupos = [...new Set(items.map(p => p.grupo))].sort((a, b) => (ORDEN.indexOf(a) + 99) % 99 - (ORDEN.indexOf(b) + 99) % 99);
    const slug = g => 'g-' + g.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w]+/g, '-').toLowerCase();
    $('#app').innerHTML = '<section class="cat-cab"><div><p class="eyebrow">Precios al por mayor</p><h1>Catálogo mayorista</h1>'
      + '<p class="lead">Elige artículos y cantidades, revisa tu pedido y envíalo por WhatsApp.<span class="extra"> Te confirmamos disponibilidad y entrega.</span></p></div></section>'
      + '<div class="tabs-bar"><nav class="cat-tabs" role="tablist" aria-label="Categorías">' + grupos.map((g, i) => '<button role="tab" aria-selected="' + (i === 0) + '" data-g="' + slug(g) + '">' + esc(g) + ' <small>' + tarjetas.filter(t => t.grupo === g).length + '</small></button>').join('') + '</nav></div>'
      + grupos.map(g => { const l = tarjetas.filter(t => t.grupo === g);
          return '<section class="grupo" id="' + slug(g) + '"><div class="grupo-cab"><h2>' + esc(g) + '</h2><span class="total-g">' + l.length + (l.length === 1 ? ' ARTÍCULO' : ' ARTÍCULOS') + '</span><span class="cuenta" aria-hidden="true"><b data-cuenta>1</b> / ' + l.length + (l.length > 1 ? ' <i>desliza</i>' : '') + '</span></div>'
            + '<div class="pista">' + l.map(tarjeta).join('') + '</div></section>'; }).join('')
      + '<p class="nota">Precios en pesos dominicanos, sujetos a cambio sin previo aviso. Enlace privado: no lo compartas.</p>';
    // La pestaña activa sigue a la categoría que está en pantalla.
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) marcarTab(e.target.id); }), { rootMargin: '-45% 0px -50% 0px' });
      document.querySelectorAll('.grupo').forEach(g => io.observe(g));
    }
    movimiento();
    resumen();
  }

  // Movimiento, como en la tienda: las tarjetas entran en cascada al verse y, en el celular,
  // la tarjeta del frente de cada vitrina se enfoca y tiñe la franja con su color.
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function movimiento() {
    const mcs = [...document.querySelectorAll('.mc')];
    if (quieto || !('IntersectionObserver' in window)) mcs.forEach(m => m.classList.add('si'));
    else {
      const ap = new IntersectionObserver(es => es.forEach(e => {
        if (!e.isIntersecting) return;
        const hermanas = [...e.target.parentNode.children].filter(x => !x.classList.contains('si'));
        e.target.style.transitionDelay = Math.min(hermanas.indexOf(e.target), 3) * 90 + 'ms';
        e.target.classList.add('si'); ap.unobserve(e.target);
        if (getComputedStyle(e.target.parentNode).gridAutoFlow === 'column') [...e.target.parentNode.children].forEach(x => { if (!x.classList.contains('si')) { x.classList.add('si'); ap.unobserve(x); } });
        setTimeout(() => { e.target.style.transitionDelay = ''; }, 1200);
      }), { threshold: .12 });
      mcs.forEach(m => ap.observe(m));
    }
    document.querySelectorAll('.pista').forEach(pista => {
      const grupo = pista.closest('.grupo'), tarjetas = [...pista.children];
      let pend = false;
      const medir = () => {
        pend = false;
        const c = pista.scrollLeft + pista.clientWidth / 2; let k = 0, d = Infinity;
        tarjetas.forEach((t, j) => { const dj = Math.abs(t.offsetLeft + t.clientWidth / 2 - c); if (dj < d) { d = dj; k = j; } });
        tarjetas.forEach((t, j) => t.classList.toggle('actual', j === k));
        grupo.style.setProperty('--g-tono', tarjetas[k].style.getPropertyValue('--tono'));
        const cu = grupo.querySelector('[data-cuenta]'); if (cu) cu.textContent = k + 1;
        if (k > 0) grupo.classList.add('movido');
      };
      pista.addEventListener('scroll', () => { if (!pend) { pend = true; requestAnimationFrame(medir); } }, { passive: true });
      addEventListener('resize', medir);
      medir();
    });
  }

  // Barra dorada de la cabecera: marca cuánto se ha recorrido del catálogo.
  (() => {
    const barra = document.querySelector('.progreso'); let pend = false;
    const pintarBarra = () => { pend = false; const h = document.documentElement.scrollHeight - innerHeight; barra.style.setProperty('--leido', h > 0 ? Math.min(1, scrollY / h) : 0); };
    addEventListener('scroll', () => { if (!pend) { pend = true; requestAnimationFrame(pintarBarra); } }, { passive: true });
  })();

  function saltar(el) { if (!el || quieto) return; el.classList.remove('salta'); void el.offsetWidth; el.classList.add('salta'); }

  function marcarTab(id) {
    const nav = document.querySelector('.cat-tabs'); if (!nav) return;
    nav.querySelectorAll('button').forEach(b => {
      const on = b.dataset.g === id; b.setAttribute('aria-selected', on);
      if (on) nav.scrollTo({ left: b.offsetLeft - (nav.clientWidth - b.clientWidth) / 2, behavior: quieto ? 'auto' : 'smooth' });
    });
  }

  function repintar(id) {
    const p = items.find(x => x.id === id), el = document.querySelector('.mc[data-id="' + id + '"] .accion');
    if (p && el) { el.innerHTML = accion(p); saltar(el.querySelector('output')); }
    resumen();
    saltar(document.getElementById('carro-t')); saltar(document.getElementById('insignia'));
  }

  function resumen() {
    let n = 0, t = 0; const lineas = [], filas = [];
    for (const [id, c] of carro) {
      const p = items.find(x => x.id === id); if (!p) continue;
      n += c; t += c * p.precio;
      lineas.push('• ' + c + ' × ' + p.nombre + ' — ' + rd(c * p.precio));
      filas.push('<div class="linea" data-linea="' + id + '" style="--tono:' + esc(p.tono || '#2a2f38') + '">'
        + '<div class="mini">' + (p.foto ? '<img src="' + esc(p.foto) + '" alt="">' : '') + '</div>'
        + '<div><h3>' + esc(p.nombre) + '</h3><span class="unit">' + rd(p.precio) + ' c/u</span></div>'
        + '<b class="sub">' + rd(c * p.precio) + '</b>'
        + '<div class="ctrl"><div class="cant"><button data-menos="' + id + '" aria-label="Quitar uno de ' + esc(p.nombre) + '">−</button><output>' + c + '</output><button data-mas="' + id + '" aria-label="Agregar uno de ' + esc(p.nombre) + '">+</button></div>'
        + '<button class="quitar" data-quitar="' + id + '">Quitar</button></div></div>');
    }
    const txt = n + (n === 1 ? ' artículo' : ' artículos');
    $('#carro').classList.toggle('ver', n > 0);
    $('#carro-n').textContent = txt;
    $('#carro-t').textContent = rd(t);
    $('#bolsa').hidden = n === 0;
    $('#insignia').textContent = n;
    $('#hoja-t').textContent = txt;
    $('#hoja-total').textContent = rd(t);
    $('#hoja-lista').innerHTML = filas.join('') || '<p class="vacio">Tu pedido está vacío. Agrega artículos del catálogo.</p>';
    const msg = 'Hola STUDIO, quiero hacer este pedido al por mayor:\n\n' + lineas.join('\n') + '\n\nTotal: ' + rd(t);
    $('#wa').href = $('#wa2').href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg);
    guardar();
  }

  // El pedido se recuerda en este teléfono si el cliente cierra y vuelve a abrir el enlace.
  const LLAVE = 'studio_mayoristas_pedido';
  function guardar() { try { localStorage.setItem(LLAVE, JSON.stringify([...carro])); } catch (e) {} }
  function recuperar() {
    try {
      for (const [id, c] of JSON.parse(localStorage.getItem(LLAVE) || '[]')) {
        const p = items.find(x => x.id === id);
        if (p && p.disponible && c > 0) carro.set(id, Math.min(999, c | 0));
      }
    } catch (e) {}
  }

  let antesDeAbrir = null;
  function abrir() {
    antesDeAbrir = document.activeElement;
    document.documentElement.classList.add('abierta'); document.body.classList.add('abierta');
    $('#hoja').setAttribute('aria-hidden', 'false');
    setTimeout(() => $('#hoja .cerrar').focus({ preventScroll: true }), 60);
  }
  function cerrar() {
    document.documentElement.classList.remove('abierta'); document.body.classList.remove('abierta');
    $('#hoja').setAttribute('aria-hidden', 'true');
    if (antesDeAbrir) antesDeAbrir.focus({ preventScroll: true });
  }
  addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('abierta')) cerrar(); });

  function cambiar(id, c) {
    c > 0 ? carro.set(id, c) : carro.delete(id);
    repintar(id);
    const out = document.querySelector('[data-linea="' + id + '"] output'); saltar(out);
    if (!carro.size && document.body.classList.contains('abierta')) setTimeout(cerrar, 350);
  }

  // Al agregar desde una tarjeta: la foto (la de la variante elegida) vuela en curva hasta la bolsa,
  // la bolsa rebota y asoma un resumen del pedido que se cierra solo; tocarlo abre el pedido completo.
  function destino() {
    const b = $('#bolsa'); b.hidden = false;   // en el primer artículo la bolsa aparece para recibir la foto
    const r = b.getBoundingClientRect();
    return r.width ? { el: b, r } : { el: $('#carro-t'), r: $('#carro-t').getBoundingClientRect() };
  }
  function volar(tarjeta) {
    const img = tarjeta && tarjeta.querySelector('.mc-escena img');
    if (quieto || !img || !img.animate) return Promise.resolve();
    const o = img.getBoundingClientRect(), { el, r: d } = destino();
    const w = Math.min(o.width, 150), h = w * (o.height / o.width || 1);
    const x0 = o.left + o.width / 2 - w / 2, y0 = o.top + o.height / 2 - h / 2;
    const x1 = d.left + d.width / 2 - w / 2, y1 = d.top + d.height / 2 - h / 2;
    const cy = Math.min(y0, y1) - 110, pasos = 16, kf = [];
    for (let i = 0; i <= pasos; i++) {
      const t = i / pasos, u = 1 - t;
      const x = x0 + (x1 - x0) * t, y = u * u * y0 + 2 * u * t * cy + t * t * y1;
      kf.push({ transform: `translate(${x}px,${y}px) rotate(${-18 * t}deg) scale(${1 - .82 * t})`, opacity: t > .9 ? 1 - (t - .9) * 8 : 1 });
    }
    const v = img.cloneNode(); v.className = 'vuelo'; v.removeAttribute('loading');
    v.style.width = w + 'px'; v.style.height = h + 'px';
    document.body.appendChild(v);
    return v.animate(kf, { duration: 720, easing: 'cubic-bezier(.45,0,.25,1)' }).finished.catch(() => {}).then(() => {
      v.remove(); el.classList.remove('recibe'); void el.offsetWidth; el.classList.add('recibe');
    });
  }
  let asomaT = 0;
  function asomar(id) {
    if (quieto) return;
    const a = $('#asoma'), filas = [...carro].reverse(), n = filas.reduce((s, [, c]) => s + c, 0);
    let t = 0; for (const [i, c] of carro) { const p = items.find(x => x.id === i); if (p) t += c * p.precio; }
    const vis = filas.slice(0, 3).map(([i, c]) => {
      const p = items.find(x => x.id === i); if (!p) return '';
      return '<div class="asoma-fila' + (i === id ? ' nueva' : '') + '" style="--tono:' + esc(p.tono || '#2a2f38') + '"><div class="mini">' + (p.foto ? '<img src="' + esc(p.foto) + '" alt="">' : '') + '</div>'
        + '<div><h4>' + esc(p.nombre) + '</h4><small>' + c + ' × ' + rd(p.precio) + '</small></div><b>' + rd(c * p.precio) + '</b></div>';
    }).join('');
    const resto = filas.length - 3;
    a.innerHTML = '<div class="asoma-cab">Tu pedido <b>' + n + '</b></div>' + vis
      + (resto > 0 ? '<p class="asoma-mas">+ ' + resto + (resto === 1 ? ' artículo más' : ' artículos más') + '</p>' : '')
      + '<div class="asoma-pie"><b>' + rd(t) + '</b><span>Ver pedido</span></div>';
    a.setAttribute('aria-label', 'Ver pedido: ' + n + ' artículos, ' + rd(t));
    a.classList.add('si'); a.setAttribute('aria-hidden', 'false');
    clearTimeout(asomaT); asomaT = setTimeout(esconder, 2600);
  }
  function esconder() { clearTimeout(asomaT); const a = $('#asoma'); a.classList.remove('si'); a.setAttribute('aria-hidden', 'true'); }
  addEventListener('scroll', () => { if ($('#asoma').classList.contains('si')) esconder(); }, { passive: true });

  // Un carrito llega rodando hasta el botón, recibe los productos del pedido (las fotos caen dentro) y se va rodando
  // hacia la derecha con rayas de velocidad: «tu pedido va en camino». Solo decorativo, dura ~2.3 s.
  function llevarPedido(wa) {
    if (!document.body.animate) return;
    const r = wa.getBoundingClientRect(), W = 118, H = 92;
    const x0 = Math.max(8, r.left + r.width / 2 - W / 2), y0 = r.top - H + 14;
    const v = document.createElement('div'); v.className = 'viaje';
    v.innerHTML = '<span class="raya" style="top:38px;width:46px"></span><span class="raya" style="top:52px;width:70px"></span><span class="raya" style="top:66px;width:38px"></span>'
      + [...carro].reverse().slice(0, 3).map(([id], i) => { const p = items.find(x => x.id === id); return p ? '<span class="cosa" style="left:' + (20 + i * 24) + 'px;--tono:' + esc(p.tono || '#2a2f38') + ';z-index:' + (3 - i) + '">' + (p.foto ? '<img src="' + esc(p.foto) + '" alt="">' : '') + '</span>' : ''; }).join('')
      + '<svg viewBox="0 0 118 92" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<path d="M4 22h14l6 8" stroke="#F2D26A" stroke-width="5"/>'
      + '<path d="M20 30h92l-10 34H30Z" fill="rgba(201,162,39,.28)" stroke="#F2D26A" stroke-width="5"/>'
      + '<path d="M44 34v26M64 34v26M84 34v26" stroke="#F2D26A" stroke-width="2.5" opacity=".55"/>'
      + '<path d="M30 64l-4 10h78" stroke="#F2D26A" stroke-width="5"/>'
      + '<g class="rueda"><circle cx="38" cy="83" r="7" fill="#0A0A0A" stroke="#F2D26A" stroke-width="4"/><path d="M38 78v10" stroke="#F2D26A" stroke-width="2"/></g>'
      + '<g class="rueda"><circle cx="96" cy="83" r="7" fill="#0A0A0A" stroke="#F2D26A" stroke-width="4"/><path d="M96 78v10" stroke="#F2D26A" stroke-width="2"/></g></svg>';
    document.body.appendChild(v);
    // Las fotos van delante de la canasta: se reordenan para que queden "dentro" (canasta encima).
    v.querySelectorAll('.cosa').forEach(c => v.insertBefore(c, v.querySelector('svg')));
    // Llega desde la izquierda y frena sobre el botón, recibe el pedido y se va por la derecha.
    const D = 2300, lejos = innerWidth - x0 + 40, at = (x, y, extra = '') => `translate(${x}px,${y}px) ${extra}`;
    const carroA = v.animate([
      { transform: at(-W - 20, y0, 'rotate(0)'), easing: 'cubic-bezier(.2,.7,.35,1)' },
      { transform: at(x0 + 10, y0, 'rotate(5deg)'), offset: .24 },
      { transform: at(x0 - 3, y0 + 1, 'rotate(-2deg)'), offset: .29 },
      { transform: at(x0, y0, 'rotate(0)'), offset: .33 },
      { transform: at(x0, y0), offset: .62 },
      { transform: at(x0 - 14, y0 + 2, 'rotate(-5deg)'), offset: .69, easing: 'cubic-bezier(.5,0,.9,.5)' },
      { transform: at(x0 + lejos, y0 - 6, 'rotate(2deg)') }
    ], { duration: D, easing: 'ease-in-out' });
    v.querySelectorAll('.cosa').forEach((c, i) => c.animate([
      { transform: 'translateY(-90px) rotate(-18deg) scale(.7)', opacity: 0 },
      { transform: 'translateY(-90px) rotate(-18deg) scale(.7)', opacity: 0, offset: .33 + i * .05 },
      { transform: 'translateY(4px) rotate(4deg) scale(1)', opacity: 1, offset: .47 + i * .05 },
      { transform: 'translateY(0) rotate(0) scale(1)', opacity: 1, offset: .55 + i * .05 },
      { transform: 'translateY(0) rotate(0) scale(1)', opacity: 1 }
    ], { duration: D, easing: 'cubic-bezier(.3,.6,.4,1)', fill: 'both' }));
    v.querySelectorAll('.rueda').forEach(g => g.animate([
      { transform: 'rotate(0)', easing: 'cubic-bezier(.2,.7,.35,1)' }, { transform: 'rotate(720deg)', offset: .26 },
      { transform: 'rotate(720deg)', offset: .69, easing: 'cubic-bezier(.6,0,.9,.6)' }, { transform: 'rotate(1620deg)' }
    ], { duration: D }));
    v.querySelectorAll('.raya').forEach((l, i) => l.animate([
      { opacity: 1, transform: 'scaleX(1.3)' }, { opacity: 0, transform: 'scaleX(.3)', offset: .22 + i * .02 },
      { opacity: 0, transform: 'scaleX(.2)', offset: .72 + i * .03 }, { opacity: 1, transform: 'scaleX(1)', offset: .86 },
      { opacity: 0, transform: 'scaleX(1.4)' }
    ], { duration: D }));
    carroA.finished.catch(() => {}).then(() => v.remove());
  }

  // Enviar por WhatsApp: primero se ve la animación completa (el carrito llega, recoge el pedido y se va)
  // y al terminar se abre WhatsApp. En el celular se abre en la misma pestaña (una ventana nueva abierta
  // con retraso la bloquea Safari); el pedido queda guardado si el cliente vuelve con «atrás».
  const ICONO_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  let enviando = false;
  function restaurarWa() {
    enviando = false;
    document.querySelectorAll('.wa').forEach(w => { clearTimeout(w._t); if (w.dataset.html) w.innerHTML = w.dataset.html; w.classList.remove('envia'); });
  }
  addEventListener('pageshow', e => { if (e.persisted) restaurarWa(); });
  document.addEventListener('click', e => {
    const wa = e.target.closest('.wa');
    if (!wa || quieto || !carro.size) return;
    e.preventDefault();
    if (enviando) return;
    enviando = true;
    const url = wa.href, r = wa.getBoundingClientRect(), onda = document.createElement('span');
    onda.className = 'onda'; onda.style.left = (e.clientX ? e.clientX - r.left : r.width / 2) + 'px'; onda.style.top = (e.clientY ? e.clientY - r.top : r.height / 2) + 'px';
    wa.classList.remove('envia'); void wa.offsetWidth; wa.classList.add('envia');
    llevarPedido(wa);
    if (!wa.dataset.html) wa.dataset.html = wa.innerHTML;
    wa.innerHTML = '<span class="ok">' + ICONO_OK + 'Preparando tu pedido…</span>';
    wa.appendChild(onda); setTimeout(() => onda.remove(), 700);
    setTimeout(() => { wa.innerHTML = '<span class="ok">' + ICONO_OK + 'Abriendo WhatsApp…</span>'; }, 1500);
    setTimeout(() => {
      if (matchMedia('(pointer:coarse)').matches) location.href = url;
      else { const w = open(url, '_blank'); if (w) w.opener = null; else location.href = url; }
      wa._t = setTimeout(restaurarWa, 2500);
    }, 2150);
  });

  document.addEventListener('click', e => {
    const mas = e.target.closest('[data-mas]'), menos = e.target.closest('[data-menos]'), tab = e.target.closest('[data-g]');
    const quitar = e.target.closest('[data-quitar]');
    const vb = e.target.closest('[data-var]');
    if (vb) { elegir(+vb.dataset.var); return; }
    if (e.target.closest('[data-abrir]')) { esconder(); abrir(); }
    else if (e.target.closest('[data-cerrar]')) cerrar();
    else if (e.target.closest('[data-vaciar]')) { if (confirm('¿Vaciar todo el pedido?')) { const ids = [...carro.keys()]; carro.clear(); ids.forEach(repintar); resumen(); setTimeout(cerrar, 250); } }
    else if (quitar) cambiar(+quitar.dataset.quitar, 0);
    else if (mas) {
      const id = +mas.dataset.mas, tarjeta = mas.closest('.mc');
      if (tarjeta && !quieto) { volar(tarjeta).then(() => { cambiar(id, (carro.get(id) || 0) + 1); asomar(id); }); }
      else cambiar(id, (carro.get(id) || 0) + 1);
    }
    else if (menos) { const id = +menos.dataset.menos; cambiar(id, (carro.get(id) || 0) - 1); }
    else if (tab) {
      marcarTab(tab.dataset.g);
      const sec = document.getElementById(tab.dataset.g), barra = document.querySelector('.tabs-bar');
      if (sec) window.scrollTo({ top: sec.getBoundingClientRect().top + scrollY - $('header').offsetHeight - (barra ? barra.offsetHeight : 0) + 4, behavior: quieto ? 'auto' : 'smooth' });
    }
  });
  cargar();
})();
</script>
</body>
</html>
