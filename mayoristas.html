<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>STUDIO Mayoristas</title>
<meta name="theme-color" content="#07080A">
<link rel="icon" href="icon-32.png?v=2" sizes="32x32">
<link rel="apple-touch-icon" href="icon-apple-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* STUDIO · catálogo mayorista privado. Mismo mundo visual que la tienda (noche + oro), un solo tema.
   Los precios NO están en este archivo: llegan de Supabase (tienda_mayoristas_catalogo) solo si
   el enlace trae la clave (#k=…). Sin clave válida la página no muestra nada. */
:root{
  --noche:#07080A; --panel:#101317; --panel2:#151920;
  --linea:rgba(255,255,255,.08); --linea2:rgba(255,255,255,.14);
  --texto:#F3F2EE; --suave:#A3A6AB; --tenue:#6C7078;
  --oro:#C9A227; --oro-luz:#F2D26A; --ok:#5BC08A; --no:#E0695E;
  --disp:-apple-system,"SF Pro Display",Inter,system-ui,"Helvetica Neue",sans-serif;
  --sans:-apple-system,"SF Pro Text",Inter,system-ui,"Helvetica Neue",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{background:var(--noche);color:var(--texto);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100svh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--oro-luz);outline-offset:3px;border-radius:8px}
.wrap{width:min(1100px,100% - 32px);margin-inline:auto}
.eyebrow{font:600 11px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--oro)}

header{position:sticky;top:0;z-index:20;background:rgba(7,8,10,.78);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top)}
.cab{display:flex;align-items:center;gap:14px;height:58px}
.logo{display:block;width:104px;height:24px;overflow:hidden;flex:none}
.logo img{width:115px;margin:-38px 0 0 -6px}
.cab .eyebrow{margin-left:auto}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 0 12px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:34px;padding:0 15px;border-radius:999px;border:1px solid var(--linea2);color:var(--suave);font-weight:600;font-size:13.5px;transition:background .2s var(--ease),color .2s var(--ease)}
.tabs button[aria-selected=true]{background:var(--texto);color:#0A0A0A;border-color:var(--texto)}

.intro{padding:26px 0 8px}
.intro h1{font:800 clamp(26px,4vw,38px)/1.05 var(--disp);letter-spacing:-.03em;text-wrap:balance}
.intro p{color:var(--suave);margin-top:8px;max-width:58ch}

.grupo{padding-top:22px}
.grupo h2{font:700 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tenue);margin-bottom:12px}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.item{display:grid;grid-template-columns:96px 1fr;grid-template-rows:auto 1fr auto;gap:4px 14px;padding:14px;border-radius:20px;background:var(--panel);border:1px solid var(--linea)}
.item.agotado{opacity:.55}
.foto{grid-row:1/4;width:96px;height:96px;border-radius:14px;background:radial-gradient(circle at 50% 40%,#232831,#12151a);display:grid;place-items:center;overflow:hidden}
.foto img{width:88%;height:88%;object-fit:contain}
.item h3{font:700 16px/1.2 var(--disp);letter-spacing:-.01em}
.item .det{color:var(--suave);font-size:12.5px;line-height:1.35}
.pie{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.precio{font:700 17px/1 var(--mono);color:var(--oro-luz);font-variant-numeric:tabular-nums}
.chip{font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:999px;border:1px solid currentColor}
.chip.si{color:var(--ok)} .chip.no{color:var(--no)}
.cant{margin-left:auto;display:flex;align-items:center;border:1px solid var(--linea2);border-radius:999px;height:34px}
.cant button{width:34px;height:34px;font-size:18px;font-weight:600;color:var(--texto)}
.cant button:disabled{color:var(--tenue);cursor:default}
.cant output{min-width:24px;text-align:center;font:700 14px var(--mono);font-variant-numeric:tabular-nums}
.agregar{margin-left:auto;height:34px;padding:0 14px;border-radius:999px;background:rgba(242,210,106,.12);color:var(--oro-luz);font-weight:700;font-size:13px;border:1px solid rgba(242,210,106,.35)}

.carro{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(11,13,16,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--linea2);transform:translateY(110%);transition:transform .35s var(--ease)}
.carro.ver{transform:none}
.carro .wrap{display:flex;align-items:center;gap:14px}
.carro .res{line-height:1.2}
.carro .res small{display:block;color:var(--suave);font-size:12px}
.carro .res b{font:700 18px var(--mono);font-variant-numeric:tabular-nums}
.wa{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px;border-radius:999px;background:linear-gradient(180deg,var(--oro-luz),var(--oro));color:#0A0A0A;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.wa svg{width:20px;height:20px}

.aviso{padding:80px 0;text-align:center;color:var(--suave)}
.aviso h1{font:800 26px/1.1 var(--disp);color:var(--texto);margin-bottom:10px}
.nota{color:var(--tenue);font-size:12.5px;padding:28px 0 10px}
@media (max-width:520px){
  .lista{grid-template-columns:1fr}
  .item{grid-template-columns:84px 1fr}
  .foto{width:84px;height:84px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap cab">
    <span class="logo"><img src="logo-studio.png" alt="STUDIO"></span>
    <span class="eyebrow">Mayoristas</span>
  </div>
  <div class="wrap"><nav class="tabs" role="tablist" id="tabs" hidden></nav></div>
</header>
<main class="wrap" id="app">
  <div class="aviso" id="estado"><p>Cargando catálogo…</p></div>
</main>
<div class="carro" id="carro" aria-live="polite">
  <div class="wrap">
    <div class="res"><small id="carro-n">0 artículos</small><b id="carro-t">RD$0</b></div>
    <a class="wa" id="wa" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
      Enviar pedido
    </a>
  </div>
</div>
<script>
(() => {
  const SB = 'https://edbknlkjnlfmkkiizdbe.supabase.co';
  const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkYmtubGtqbmxmbWtraWl6ZGJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMjg3MTYsImV4cCI6MjEwNTYwNDcxNn0.WKAda5kdWH9TxT0YbMNhJu-DoLFmXgLyrJFGD7Nr2Ec';
  const WHATSAPP = '18297448336';               // número mayorista (confirmado por el dueño)
  const ORDEN = ['Movilidad', 'Monta cargas', 'Hogar', 'Tecnología'];
  const $ = s => document.querySelector(s);
  const rd = n => 'RD$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clave = new URLSearchParams(location.hash.slice(1)).get('k') || '';
  const carro = new Map();   // id → cantidad
  let items = [];

  function aviso(titulo, texto) {
    $('#app').innerHTML = '<div class="aviso"><h1>' + esc(titulo) + '</h1><p>' + esc(texto) + '</p></div>';
  }

  async function cargar() {
    if (clave.length < 20) return aviso('Enlace no válido', 'Pide el enlace del catálogo mayorista a STUDIO.');
    try {
      const r = await fetch(SB + '/rest/v1/rpc/tienda_mayoristas_catalogo', {
        method: 'POST',
        headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_clave: clave }),
      });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      if (!Array.isArray(d)) return aviso('Enlace no válido', 'Este enlace ya no está activo. Pide uno nuevo a STUDIO.');
      items = d;
      pintar();
    } catch (e) {
      aviso('No se pudo cargar', 'Revisa tu conexión y vuelve a intentarlo.');
    }
  }

  function fila(p) {
    const n = carro.get(p.id) || 0;
    const accion = !p.disponible ? ''
      : n ? '<div class="cant"><button data-menos="' + p.id + '" aria-label="Quitar uno">−</button><output>' + n + '</output><button data-mas="' + p.id + '" aria-label="Agregar uno">+</button></div>'
          : '<button class="agregar" data-mas="' + p.id + '">Agregar</button>';
    return '<article class="item' + (p.disponible ? '' : ' agotado') + '" data-id="' + p.id + '">'
      + '<div class="foto">' + (p.foto ? '<img src="' + esc(p.foto) + '" alt="" loading="lazy">' : '') + '</div>'
      + '<h3>' + esc(p.nombre) + '</h3><p class="det">' + esc(p.detalle) + '</p>'
      + '<div class="pie"><span class="precio">' + rd(p.precio) + '</span>'
      + '<span class="chip ' + (p.disponible ? 'si">Disponible' : 'no">Agotado') + '</span>' + accion + '</div></article>';
  }

  function pintar() {
    const grupos = [...new Set(items.map(p => p.grupo))].sort((a, b) => (ORDEN.indexOf(a) + 99) % 99 - (ORDEN.indexOf(b) + 99) % 99);
    $('#app').innerHTML = '<section class="intro"><p class="eyebrow">Precios al por mayor</p><h1>Catálogo mayorista STUDIO</h1>'
      + '<p>Elige los artículos y cantidades, y envía el pedido por WhatsApp. Te confirmamos disponibilidad y entrega.</p></section>'
      + grupos.map(g => '<section class="grupo" id="g-' + esc(g) + '"><h2>' + esc(g) + '</h2><div class="lista">'
        + items.filter(p => p.grupo === g).map(fila).join('') + '</div></section>').join('')
      + '<p class="nota">Precios en pesos dominicanos, sujetos a cambio sin previo aviso. Enlace privado: no lo compartas.</p>';
    const tabs = $('#tabs');
    tabs.innerHTML = grupos.map((g, i) => '<button role="tab" aria-selected="' + (i === 0) + '" data-g="' + esc(g) + '">' + esc(g) + '</button>').join('');
    tabs.hidden = grupos.length < 2;
    resumen();
  }

  function repintar(id) {
    const p = items.find(x => x.id === id), el = document.querySelector('.item[data-id="' + id + '"]');
    if (p && el) el.outerHTML = fila(p);
    resumen();
  }

  function resumen() {
    let n = 0, t = 0; const lineas = [];
    for (const [id, c] of carro) {
      const p = items.find(x => x.id === id); if (!p) continue;
      n += c; t += c * p.precio;
      lineas.push('• ' + c + ' × ' + p.nombre + ' — ' + rd(c * p.precio));
    }
    $('#carro').classList.toggle('ver', n > 0);
    $('#carro-n').textContent = n + (n === 1 ? ' artículo' : ' artículos');
    $('#carro-t').textContent = rd(t);
    const msg = 'Hola STUDIO, quiero hacer este pedido al por mayor:\n\n' + lineas.join('\n') + '\n\nTotal: ' + rd(t);
    $('#wa').href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg);
  }

  document.addEventListener('click', e => {
    const mas = e.target.closest('[data-mas]'), menos = e.target.closest('[data-menos]'), tab = e.target.closest('[data-g]');
    if (mas) { const id = +mas.dataset.mas; carro.set(id, (carro.get(id) || 0) + 1); repintar(id); }
    else if (menos) { const id = +menos.dataset.menos, c = (carro.get(id) || 0) - 1; c > 0 ? carro.set(id, c) : carro.delete(id); repintar(id); }
    else if (tab) {
      document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b === tab));
      const sec = document.getElementById('g-' + tab.dataset.g);
      if (sec) window.scrollTo({ top: sec.getBoundingClientRect().top + scrollY - $('header').offsetHeight - 8, behavior: 'smooth' });
    }
  });
  cargar();
})();
</script>
</body>
</html>
